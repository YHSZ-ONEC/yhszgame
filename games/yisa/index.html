<script>
'use strict';
/* =====================================================================
   泪之深渊 Tears of the Abyss
   类以撒 Roguelike：程序化地牢 / 八向眼泪 / 标签协同 / 状态机敌人
   多阶段Boss / 商店与隐藏房 / 角色解锁与元进度
   美术与音效 100% 由代码生成，无任何外部素材
   ===================================================================== */

/* ---------------- 配置（集中管理，无散落魔法数字） ---------------- */
const CFG = {
  W: 960, H: 600, HUD: 56,
  TILE: 56, GW: 13, GH: 7, WALL: 60,
  FLOORS: 8,
  PLAYER: { R: 13, SPD: 225, INVULN: 1.0 },
  TEAR: { SPD: 430, Z: 26, MAXR: 12 },
  DOORW: 74, DOORH: 60,
  BOMB: { FUSE: 1.5, R: 78, DMG: 60 },
  SAVE_KEY: 'tears_of_abyss_v1'
};
// 房间几何（依据 TILE/GW/GH/WALL 推导）
CFG.ROOMX = (CFG.W - (CFG.GW * CFG.TILE + CFG.WALL * 2)) / 2;   // 56
CFG.ROOMY = (CFG.H - (CFG.GH * CFG.TILE + CFG.WALL * 2) + CFG.HUD - CFG.HUD) / 2 + CFG.HUD; // 72
CFG.INNER = { x: CFG.ROOMX + CFG.WALL, y: CFG.ROOMY + CFG.WALL,
              w: CFG.GW * CFG.TILE, h: CFG.GH * CFG.TILE };
CFG.CENTER = { x: CFG.INNER.x + CFG.INNER.w / 2, y: CFG.INNER.y + CFG.INNER.h / 2 };
CFG.DOORS = {
  N: { x: CFG.CENTER.x, y: CFG.ROOMY + CFG.WALL / 2 },
  S: { x: CFG.CENTER.x, y: CFG.ROOMY + CFG.WALL + CFG.INNER.h + CFG.WALL / 2 },
  W: { x: CFG.ROOMX + CFG.WALL / 2, y: CFG.CENTER.y },
  E: { x: CFG.ROOMX + CFG.WALL + CFG.INNER.w + CFG.WALL / 2, y: CFG.CENTER.y }
};
const DIRV = { N: [0, -1], S: [0, 1], W: [-1, 0], E: [1, 0] };
const OPP = { N: 'S', S: 'N', W: 'E', E: 'W' };
const SIDES = ['N', 'E', 'S', 'W'];

// 主题色板（每章节）
const THEMES = [
  { name: '地窖', floor: '#4a3b2e', floor2: '#544437', wall: '#2e2318', wallTop: '#3a2d1f',
    line: '#3c2f23', door: '#57402a', accent: '#8a6d4a', blood: '#7a1f1f', rock: '#6b5a45', amb: '#241a10' },
  { name: '洞窟', floor: '#3d4a41', floor2: '#465549', wall: '#232e27', wallTop: '#2b3a30',
    line: '#2c3a30', door: '#3e5546', accent: '#6f9a7a', blood: '#6d1f1f', rock: '#5c6d5c', amb: '#101c14' },
  { name: '深渊', floor: '#2f3547', floor2: '#374054', wall: '#1b2030', wallTop: '#232a3e',
    line: '#232c40', door: '#39445f', accent: '#5f739c', blood: '#5f1620', rock: '#4a5468', amb: '#0c0f1c' },
  { name: '母体', floor: '#4a2f2f', floor2: '#543737', wall: '#2e1b1b', wallTop: '#3a2323',
    line: '#3c2424', door: '#5f2e2e', accent: '#9c5f6a', blood: '#7a1620', rock: '#684040', amb: '#1c0c0c' }
];
const FLOOR_NAMES = ['地窖 I','地窖 II','洞窟 I','洞窟 II','深渊 I','深渊 II','母体 I','母体 II'];

/* ---------------- 工具 ---------------- */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const rndi = (a, b) => Math.floor(rnd(a, b + 1));
const chance = p => Math.random() < p;
const choice = arr => arr[Math.floor(Math.random() * arr.length)];
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const dist2 = (x1, y1, x2, y2) => Math.hypot(x1 - x2, y1 - y2);
const ang = (a, b) => Math.atan2(b.y - a.y, b.x - a.x);
function shuffle(arr) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function mulberry(seed) { let t = seed >>> 0; return function () { t += 0x6D2B79F5; let r = Math.imul(t ^ t >>> 15, 1 | t); r ^= r + Math.imul(r ^ r >>> 7, 61 | r); return ((r ^ r >>> 14) >>> 0) / 4294967296; }; }
function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function rr(g, x, y, w, h, r) { // 圆角矩形路径
  r = Math.min(r, w / 2, h / 2);
  g.beginPath(); g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
function tileCX(c) { return CFG.INNER.x + (c + 0.5) * CFG.TILE; }
function tileCY(r) { return CFG.INNER.y + (r + 0.5) * CFG.TILE; }
function cellOf(x, y) { return { c: Math.floor((x - CFG.INNER.x) / CFG.TILE), r: Math.floor((y - CFG.INNER.y) / CFG.TILE) }; }

/* ---------------- 画布与缩放 ---------------- */
const cv = document.getElementById('cv');
const cx = cv.getContext('2d');
function fitCanvas() {
  const s = Math.min(window.innerWidth / CFG.W, window.innerHeight / CFG.H);
  cv.style.width = (CFG.W * s) + 'px'; cv.style.height = (CFG.H * s) + 'px';
}
window.addEventListener('resize', fitCanvas); fitCanvas();

/* ---------------- 输入（含手机/平板蓝牙键盘适配） ---------------- */
const Keys = { down: {}, pressed: {} };
const Mouse = { x: 0, y: 0, click: false, down: false };
const PREVENT = new Set(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','Tab']);
/* 部分移动浏览器蓝牙键盘下 e.code 为空或错误，用 e.key 兜底推导 */
const KEYMAP_FALLBACK = { ' ': 'Space', 'ArrowUp': 'ArrowUp', 'ArrowDown': 'ArrowDown', 'ArrowLeft': 'ArrowLeft', 'ArrowRight': 'ArrowRight', Enter: 'Enter', Escape: 'Escape', Tab: 'Tab', Shift: 'ShiftLeft', Control: 'ControlLeft', Alt: 'AltLeft' };
function normCode(e) {
  if (e.code && e.code !== 'Unidentified') return e.code;
  const k = e.key;
  if (!k || k === 'Unidentified') return '';
  if (k.length === 1) {
    const up = k.toUpperCase();
    if (up >= 'A' && up <= 'Z') return 'Key' + up;
    if (up >= '0' && up <= '9') return 'Digit' + up;
  }
  return KEYMAP_FALLBACK[k] || k;
}
function clearKeys() { Keys.down = {}; } // 失焦时 keyup 不会送达，直接清空防止卡键
window.addEventListener('keydown', e => {
  const code = normCode(e);
  if (!code) return;
  if (PREVENT.has(code)) e.preventDefault();
  if (!e.repeat && !Keys.down[code]) Keys.pressed[code] = true;
  Keys.down[code] = true;
  Audio2.unlock();
}, { capture: true, passive: false });
window.addEventListener('keyup', e => {
  const code = normCode(e);
  if (!code) return;
  Keys.down[code] = false;
}, { capture: true });
window.addEventListener('blur', clearKeys);
window.addEventListener('pagehide', clearKeys);
document.addEventListener('visibilitychange', () => { if (document.hidden) clearKeys(); });
function canvasPos(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * CFG.W, y: (e.clientY - r.top) / r.height * CFG.H };
}
cv.addEventListener('mousemove', e => { const p = canvasPos(e); Mouse.x = p.x; Mouse.y = p.y; });
cv.addEventListener('mousedown', e => { const p = canvasPos(e); Mouse.x = p.x; Mouse.y = p.y; Mouse.down = true; Mouse.click = true; Audio2.unlock(); });
window.addEventListener('mouseup', () => { Mouse.down = false; });
cv.addEventListener('contextmenu', e => e.preventDefault());
/* 触摸：手机/平板点按菜单、防止浏览器滚动缩放抢事件（canvasPos 直接读 clientX/Y，触点对象同样适用） */
cv.addEventListener('touchstart', e => {
  e.preventDefault();
  const t = e.changedTouches[0];
  if (t) { const p = canvasPos(t); Mouse.x = p.x; Mouse.y = p.y; }
  Mouse.down = true; Mouse.click = true; Audio2.unlock();
}, { passive: false });
cv.addEventListener('touchmove', e => {
  e.preventDefault();
  const t = e.changedTouches[0];
  if (t) { const p = canvasPos(t); Mouse.x = p.x; Mouse.y = p.y; }
}, { passive: false });
cv.addEventListener('touchend', e => { e.preventDefault(); Mouse.down = false; }, { passive: false });
cv.addEventListener('touchcancel', () => { Mouse.down = false; });
function key(...codes) { return codes.some(c => Keys.down[c]); }
function keyHit(...codes) { return codes.some(c => Keys.pressed[c]); }

/* =====================================================================
   程序化音频引擎（WebAudio，全部实时合成）
   ===================================================================== */
const Audio2 = {
  ctx: null, master: null, musGain: null, sfxGain: null, muted: false,
  unlock() {
    if (!this.ctx) {
      try {
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        this.master = this.ctx.createGain(); this.master.gain.value = 0.8;
        this.master.connect(this.ctx.destination);
        this.sfxGain = this.ctx.createGain(); this.sfxGain.gain.value = 0.9; this.sfxGain.connect(this.master);
        this.musGain = this.ctx.createGain(); this.musGain.gain.value = 0.4; this.musGain.connect(this.master);
      } catch (e) { this.ctx = null; }
    }
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  },
  toggleMute() { this.muted = !this.muted; if (this.master) this.master.gain.value = this.muted ? 0 : 0.8; }
};
function tone(freq, dur, type = 'square', vol = 0.2, slide = 0, delay = 0, dest) {
  const A = Audio2; if (!A.ctx || A.muted) return;
  const t0 = A.ctx.currentTime + delay;
  const o = A.ctx.createOscillator(), g = A.ctx.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t0);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, freq * slide), t0 + dur);
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(dest || A.sfxGain);
  o.start(t0); o.stop(t0 + dur + 0.02);
}
function noiseBurst(dur, vol = 0.3, freq = 1200, q = 1, delay = 0, type = 'lowpass') {
  const A = Audio2; if (!A.ctx || A.muted) return;
  const t0 = A.ctx.currentTime + delay;
  const len = Math.max(1, Math.floor(A.ctx.sampleRate * dur));
  const buf = A.ctx.createBuffer(1, len, A.ctx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const src = A.ctx.createBufferSource(); src.buffer = buf;
  const f = A.ctx.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
  const g = A.ctx.createGain(); g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  src.connect(f); f.connect(g); g.connect(A.sfxGain);
  src.start(t0);
}
const SFX = {
  shoot() { tone(rnd(820, 900), 0.07, 'triangle', 0.10, 0.6); },
  splash() { noiseBurst(0.12, 0.10, 2600, 0.8, 0, 'bandpass'); },
  hit() { tone(160, 0.06, 'square', 0.12, 0.7); noiseBurst(0.05, 0.08, 900); },
  squish() { noiseBurst(0.2, 0.25, 500); tone(90, 0.18, 'sine', 0.2, 0.5); },
  hurt() { tone(190, 0.22, 'sawtooth', 0.22, 0.5); noiseBurst(0.15, 0.18, 700); },
  die() { [392, 311, 262, 196].forEach((f, i) => tone(f, 0.35, 'square', 0.16, 1, i * 0.22)); noiseBurst(0.6, 0.25, 400); },
  coin() { tone(1319, 0.06, 'square', 0.12); tone(1760, 0.14, 'square', 0.12, 1, 0.06); },
  heart() { tone(523, 0.1, 'sine', 0.2); tone(659, 0.16, 'sine', 0.2, 1, 0.09); },
  key() { tone(1046, 0.08, 'triangle', 0.18); tone(1568, 0.1, 'triangle', 0.15, 1, 0.07); },
  bombSet() { tone(300, 0.1, 'square', 0.15, 1.6); },
  fuse() { noiseBurst(0.05, 0.06, 4000, 1, 0, 'highpass'); },
  boom() { noiseBurst(0.55, 0.5, 220, 0.6); tone(60, 0.5, 'sine', 0.45, 0.4); G.shakeAdd(9); },
  door() { noiseBurst(0.3, 0.2, 300); tone(140, 0.25, 'square', 0.1, 0.6); },
  secret() { [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.18, 'triangle', 0.16, 1, i * 0.1)); },
  item() { [392, 523, 659, 784].forEach((f, i) => tone(f, 0.22, 'square', 0.14, 1, i * 0.09)); },
  synergy() { [659, 831, 988, 1319].forEach((f, i) => tone(f, 0.25, 'triangle', 0.16, 1, i * 0.08)); },
  roar() { tone(120, 0.7, 'sawtooth', 0.3, 0.45); noiseBurst(0.7, 0.3, 300); G.shakeAdd(6); },
  stomp() { tone(70, 0.3, 'sine', 0.5, 0.35); noiseBurst(0.25, 0.3, 180); },
  laser() { tone(1400, 0.35, 'sawtooth', 0.22, 0.15); noiseBurst(0.3, 0.15, 3000, 2, 0, 'bandpass'); },
  tp() { tone(900, 0.18, 'sine', 0.15, 0.3); tone(500, 0.18, 'sine', 0.12, 2.2, 0.05); },
  click() { tone(700, 0.045, 'square', 0.1); },
  buy() { tone(880, 0.07, 'square', 0.13); tone(1320, 0.12, 'square', 0.13, 1, 0.06); },
  err() { tone(150, 0.16, 'sawtooth', 0.16, 0.7); },
  trap() { tone(300, 0.3, 'triangle', 0.16, 0.3); noiseBurst(0.3, 0.15, 500); },
  unlockJ() { [523, 784, 1046, 1568].forEach((f, i) => tone(f, 0.22, 'triangle', 0.16, 1, i * 0.12)); },
  win() { [523, 659, 784, 1046, 1319, 1568].forEach((f, i) => tone(f, 0.4, 'square', 0.15, 1, i * 0.14)); }
};
/* --- 程序化背景音乐：低音 + 旋律 + 节奏，随章节/Boss变化 --- */
const MUS = {
  on: false, boss: false, chapter: 0, seed: 1, t0: 0, beat: 0, bpm: 96, nextT: 0,
  rng: null, bassSeq: [], leadSeq: [],
  start(chapter, boss) {
    this.on = true; this.chapter = chapter; this.boss = boss;
    this.seed = (Math.floor(Math.random() * 1e9) + chapter * 7919) >>> 0;
    this.rng = mulberry(this.seed);
    this.bpm = boss ? 128 : 96 + chapter * 6;
    const roots = [110, 98, 87.31]; // A2/G2/F2 小调暗色
    const root = roots[chapter % 3];
    const minor = [0, 3, 5, 7, 10, 12];
    this.bassSeq = []; this.leadSeq = [];
    for (let i = 0; i < 8; i++) this.bassSeq.push(this.rng() < 0.7 ? root : root * Math.pow(2, choice([0, 3, 5, 7]) / 12) / 2 * 2);
    for (let i = 0; i < 16; i++) this.leadSeq.push(this.rng() < 0.62 ? root * 2 * Math.pow(2, choice(minor) / 12) : 0);
    if (boss) for (let i = 0; i < 16; i++) if (this.rng() < 0.4) this.leadSeq[i] = root * 2 * Math.pow(2, choice(minor) / 12);
    this.beat = 0;
    if (Audio2.ctx) this.nextT = Audio2.ctx.currentTime + 0.1;
  },
  stop() { this.on = false; },
  note(freq, t, dur, type, vol) {
    const A = Audio2; if (!A.ctx || A.muted) return;
    const o = A.ctx.createOscillator(), g = A.ctx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(A.musGain); o.start(t); o.stop(t + dur + 0.05);
  },
  update() {
    const A = Audio2; if (!this.on || !A.ctx || A.muted) return;
    const spb = 60 / this.bpm / 2; // 八分音符
    if (this.nextT < A.ctx.currentTime - 0.1) this.nextT = A.ctx.currentTime + 0.05;
    while (this.nextT < A.ctx.currentTime + 0.35) {
      const b = this.beat;
      if (b % 4 === 0) this.note(this.bassSeq[(b / 4) % 8] / 2, this.nextT, spb * 1.8, 'triangle', 0.30);
      if (b % 2 === 1) this.note(this.bassSeq[Math.floor(b / 2) % 8], this.nextT, spb * 0.9, 'sawtooth', 0.06);
      const ld = this.leadSeq[b % 16];
      if (ld) this.note(ld, this.nextT, spb * 0.85, 'square', this.boss ? 0.055 : 0.045);
      if (b % 4 === 0) tone(55, 0.09, 'sine', 0.24, 0.5, this.nextT - A.ctx.currentTime, A.musGain);
      if (b % 2 === 1 && this.boss) noiseBurst(0.03, 0.05, 6000, 1, Math.max(0, this.nextT - A.ctx.currentTime), 'highpass');
      this.nextT += spb; this.beat++;
    }
  }
};

/* =====================================================================
   元进度存档（localStorage）
   ===================================================================== */
const META = {
  data: null,
  DEF() {
    return { souls: 0, runs: 0, wins: 0, kills: 0, bossKills: 0, bestFloor: 0,
      chars: { tear: true, vivi: false, iron: false, blind: false },
      up: { heart: 0, dmg: 0, bomb: 0, key: 0, luck: 0, revive: 0 },
      seen: {}, syn: {} };
  },
  load() {
    try { const s = localStorage.getItem(CFG.SAVE_KEY); this.data = s ? Object.assign(this.DEF(), JSON.parse(s)) : this.DEF(); }
    catch (e) { this.data = this.DEF(); }
    this.data.up = Object.assign(this.DEF().up, this.data.up || {});
    this.data.chars = Object.assign(this.DEF().chars, this.data.chars || {});
  },
  save() { try { localStorage.setItem(CFG.SAVE_KEY, JSON.stringify(this.data)); } catch (e) {} }
};
META.load();

/* =====================================================================
   全局状态 / 主循环骨架
   ===================================================================== */
const G = {
  state: 'menu', t: 0, frame: 0,
  shake: 0, shakeAdd(v) { this.shake = Math.min(18, this.shake + v); },
  whiteFlash: 0, redFlash: 0,
  fade: { a: 0, dir: 0, cb: null },
  banners: [], bigBanner: null,
  mouse: Mouse, hitUI: false
};
function fadeTo(cb, speed = 3) { G.fade.dir = 1; G.fade.speed = speed; G.fade.cb = cb; }
function banner(txt, sub, col = '#ffe9a8', dur = 3) { G.banners.push({ txt, sub, col, t: dur, dur }); }
function bigBanner(txt, sub, col = '#ffd94d', dur = 2.2) { G.bigBanner = { txt, sub, col, t: dur, dur }; }

const Screens = {}; // 各界面注册：{update(dt), draw()}
let last = 0;
function loop(t) {
  const dt = Math.min(0.033, (t - last) / 1000 || 0.016); last = t;
  G.t += dt; G.frame++;
  MUS.update();
  const sc = Screens[G.state];
  if (sc && sc.update) sc.update(dt);
  G.shake *= Math.pow(0.001, dt); if (G.shake < 0.1) G.shake = 0;
  G.whiteFlash = Math.max(0, G.whiteFlash - dt * 3);
  G.redFlash = Math.max(0, G.redFlash - dt * 2);
  for (let i = G.banners.length - 1; i >= 0; i--) { G.banners[i].t -= dt; if (G.banners[i].t <= 0) G.banners.splice(i, 1); }
  if (G.bigBanner) { G.bigBanner.t -= dt; if (G.bigBanner.t <= 0) G.bigBanner = null; }
  // 渐变
  const f = G.fade;
  if (f.dir === 1) { f.a += dt * (f.speed || 3); if (f.a >= 1) { f.a = 1; f.dir = -1; if (f.cb) { const cb = f.cb; f.cb = null; cb(); } } }
  else if (f.dir === -1) { f.a -= dt * (f.speed || 3); if (f.a <= 0) { f.a = 0; f.dir = 0; } }
  render();
  if (keyHit('KeyM')) Audio2.toggleMute();
  Keys.pressed = {}; Mouse.click = false;
  requestAnimationFrame(loop);
}
function render() {
  cx.save();
  cx.clearRect(0, 0, CFG.W, CFG.H);
  if (G.shake > 0) cx.translate(rnd(-G.shake, G.shake), rnd(-G.shake, G.shake));
  const sc = Screens[G.state];
  if (sc && sc.draw) sc.draw();
  cx.restore();
  // 全屏闪光与渐暗（不受震屏影响）
  if (G.whiteFlash > 0) { cx.fillStyle = `rgba(255,255,255,${G.whiteFlash * 0.8})`; cx.fillRect(0, 0, CFG.W, CFG.H); }
  if (G.redFlash > 0) { cx.fillStyle = `rgba(160,20,20,${G.redFlash * 0.35})`; cx.fillRect(0, 0, CFG.W, CFG.H); }

  // 顶部横幅提示
  let by = 96;
  for (const b of G.banners) {
    const a = clamp(b.t / 0.4, 0, 1) * clamp((b.dur - b.t) / 0.3, 0, 1);
    cx.globalAlpha = a;
    cx.font = 'bold 22px "Microsoft YaHei", sans-serif';
    cx.textAlign = 'center';
    cx.fillStyle = 'rgba(0,0,0,0.65)'; rr(cx, CFG.W / 2 - 220, by - 22, 440, b.sub ? 58 : 38, 10); cx.fill();
    cx.fillStyle = b.col; cx.fillText(b.txt, CFG.W / 2, by);
    if (b.sub) { cx.font = '15px "Microsoft YaHei", sans-serif'; cx.fillStyle = '#d8d2c8'; cx.fillText(b.sub, CFG.W / 2, by + 24); }
    cx.globalAlpha = 1; by += b.sub ? 70 : 48;
  }
  if (G.bigBanner) {
    const B = G.bigBanner, a = clamp(B.t / 0.4, 0, 1) * clamp((B.dur - B.t) / 0.3, 0, 1);

    cx.globalAlpha = 1;
  }
  if (Audio2.muted) { cx.font = '13px "Microsoft YaHei"'; cx.textAlign = 'right'; cx.fillStyle = '#9a9aa5'; cx.fillText('静音 [M]', CFG.W - 12, CFG.H - 10); }
}
window.addEventListener('error', e => {

const SPR = { enemy: {}, icon: {}, fire: [], coin: [], poop: [] };
function mkSpr(w, h, fn) { const c = mkCanvas(w, h); const g = c.getContext('2d'); fn(g, w, h); return c; }
// 描边圆（大色块+深色描边）
function blob(g, x, y, r, fill, line = '#160f0c', lw = 3) {
  g.fillStyle = fill; g.strokeStyle = line; g.lineWidth = lw;
  g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill(); g.stroke();
}
function eye(g, x, y, r, px = 0, py = 0, line = '#160f0c') {
  g.fillStyle = '#f5efe4'; g.strokeStyle = line; g.lineWidth = 2;
  g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill(); g.stroke();
  g.fillStyle = '#1b1210';
  g.beginPath(); g.arc(x + px * r * 0.45, y + py * r * 0.45, r * 0.45, 0, TAU); g.fill();
}
function teardropPath(g, x, y, r) {
  g.beginPath();
  g.moveTo(x, y - r * 1.4);
  g.bezierCurveTo(x + r, y - r * 0.3, x + r * 0.95, y + r * 0.6, x, y + r * 0.8);
  g.bezierCurveTo(x - r * 0.95, y + r * 0.6, x - r, y - r * 0.3, x, y - r * 1.4);
  g.closePath();
}

/* ---------- 房间纹理（每层生成一次，含随机血渍裂纹） ---------- */
function buildRoomTex(themeIdx) {
  const T = THEMES[themeIdx];
  const w = CFG.GW * CFG.TILE + CFG.WALL * 2, h = CFG.GH * CFG.TILE + CFG.WALL * 2;
  const R = mulberry((RUN ? RUN.seed : 1) * 31 + themeIdx * 7717 + 13);
  return mkSpr(w, h, g => {
    // 外墙（石砖）
    g.fillStyle = T.wall; g.fillRect(0, 0, w, h);
    g.fillStyle = T.wallTop;
    for (let y = 0; y < h; y += 30) for (let x = 0; x < w; x += 46) {
      const ox = (y / 30 % 2) * 23;
      if (x + ox > w) continue;
      g.fillStyle = R() < 0.5 ? T.wallTop : shade(T.wallTop, -8);
      g.fillRect(x + ox + 1, y + 1, 44, 28);
    }
    // 墙内侧阴影线
    g.strokeStyle = 'rgba(0,0,0,0.5)'; g.lineWidth = 4;
    g.strokeRect(CFG.WALL - 2, CFG.WALL - 2, CFG.GW * CFG.TILE + 4, CFG.GH * CFG.TILE + 4);
    // 地面
    g.fillStyle = T.floor; g.fillRect(CFG.WALL, CFG.WALL, CFG.GW * CFG.TILE, CFG.GH * CFG.TILE);
    for (let r = 0; r < CFG.GH; r++) for (let c = 0; c < CFG.GW; c++) {
      if (R() < 0.5) { g.fillStyle = T.floor2; g.fillRect(CFG.WALL + c * CFG.TILE + 2, CFG.WALL + r * CFG.TILE + 2, CFG.TILE - 4, CFG.TILE - 4); }
    }
    g.strokeStyle = T.line; g.lineWidth = 2;
    for (let c = 0; c <= CFG.GW; c++) { g.beginPath(); g.moveTo(CFG.WALL + c * CFG.TILE, CFG.WALL); g.lineTo(CFG.WALL + c * CFG.TILE, CFG.WALL + CFG.GH * CFG.TILE); g.stroke(); }
    for (let r = 0; r <= CFG.GH; r++) { g.beginPath(); g.moveTo(CFG.WALL, CFG.WALL + r * CFG.TILE); g.lineTo(CFG.WALL + CFG.GW * CFG.TILE, CFG.WALL + r * CFG.TILE); g.stroke(); }
    // 污渍与裂纹
    for (let i = 0; i < 9; i++) {
      const x = CFG.WALL + R() * CFG.GW * CFG.TILE, y = CFG.WALL + R() * CFG.GH * CFG.TILE;
      g.fillStyle = i < 4 ? hexA(T.blood, 0.35) : 'rgba(0,0,0,0.18)';
      g.beginPath(); g.ellipse(x, y, 14 + R() * 26, 8 + R() * 16, R() * 3, 0, TAU); g.fill();
    }
    g.strokeStyle = 'rgba(0,0,0,0.25)'; g.lineWidth = 1.5;
    for (let i = 0; i < 5; i++) {
      let x = CFG.WALL + R() * CFG.GW * CFG.TILE, y = CFG.WALL + R() * CFG.GH * CFG.TILE;
      g.beginPath(); g.moveTo(x, y);
      for (let s = 0; s < 4; s++) { x += (R() - 0.5) * 50; y += (R() - 0.5) * 40; g.lineTo(x, y); }
      g.stroke();
    }
  });
}
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const r = clamp((n >> 16) + amt, 0, 255), g2 = clamp(((n >> 8) & 255) + amt, 0, 255), b = clamp((n & 255) + amt, 0, 255);
  return `rgb(${r},${g2},${b})`;
}
function hexA(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`;
}

function buildIcons() {
  SPR.icon._heartBase = mkSpr(48, 48, g => {
    g.fillStyle = '#c92f2f'; g.strokeStyle = '#4a0e0e'; g.lineWidth = 2.5;
    g.beginPath(); g.moveTo(24, 38);
    g.bezierCurveTo(6, 26, 9, 10, 20, 14); g.bezierCurveTo(22, 15, 24, 17, 24, 19);
    g.bezierCurveTo(24, 17, 26, 15, 28, 14); g.bezierCurveTo(39, 10, 42, 26, 24, 38);
    g.closePath(); g.fill(); g.stroke();
  });
  for (const name in ICON_DRAW) {
    SPR.icon[name] = mkSpr(48, 48, g => { g.save(); ICON_DRAW[name](g); g.restore(); });
  }
  SPR.icon.heart = SPR.heart; SPR.icon.soul = SPR.soulHeart;
  SPR.icon.coin = SPR.coin[0]; SPR.icon.bombp = SPR.bombPick; SPR.icon.keyp = SPR.key;
  SPR.icon.skull = mkSpr(48, 48, g => {
    blob(g, 24, 22, 13, '#ded4c0');
    g.fillStyle = '#1b1210'; g.beginPath(); g.ellipse(18, 20, 4, 5.5, 0, 0, TAU); g.ellipse(30, 20, 4, 5.5, 0, 0, TAU); g.fill();
    g.fillStyle = '#ded4c0'; g.fillRect(15, 32, 18, 8);
    g.fillStyle = '#160f0c'; g.fillRect(19, 32, 3, 7); g.fillRect(26, 32, 3, 7);
  });
  SPR.icon.star = mkSpr(48, 48, g => {
    g.fillStyle = '#ffd94d'; g.strokeStyle = '#8a6d10'; g.lineWidth = 2.5; g.beginPath();
    for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, r = i % 2 ? 7 : 16; const x = 24 + Math.cos(a) * r, y = 24 + Math.sin(a) * r; i ? g.lineTo(x, y) : g.moveTo(x, y); }
    g.closePath(); g.fill(); g.stroke();
  });
  SPR.icon.question = mkSpr(48, 48, g => {
    g.font = 'bold 34px "Microsoft YaHei"'; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillStyle = '#000'; g.fillText('?', 25, 26); g.fillStyle = '#ffd94d'; g.fillText('?', 24, 24);
  });
  SPR.icon.swords = mkSpr(48, 48, g => {
    // 交叉双剑（挑战房门图标）
    g.lineCap = 'round';
    for (const [a, col] of [[Math.PI / 4, '#c9c9d4'], [-Math.PI / 4, '#9a9aa8']]) {
      g.save(); g.translate(24, 24); g.rotate(a);
      g.strokeStyle = col; g.lineWidth = 5;
      g.beginPath(); g.moveTo(-13, 13); g.lineTo(11, -11); g.stroke();
      g.strokeStyle = '#6a5a2a'; g.lineWidth = 4;
      g.beginPath(); g.moveTo(-13, 8); g.lineTo(-8, 13); g.stroke();
      g.fillStyle = '#e8d8b0'; g.beginPath(); g.arc(13, -13, 3.5, 0, TAU); g.fill();
      g.restore();
    }
  });
}

function genFloor(floorIdx) {
  RUN.floorIdx = floorIdx;

  RUN.seed = (RUN.seedBase + floorIdx * 7919) >>> 0;
  const R = mulberry(RUN.seed);

  const targetRooms = Math.min(15, 9 + Math.floor(floorIdx * 1.1) + Math.floor(R() * 3));
  let rooms = null;
  for (let attempt = 0; attempt < 60; attempt++) {
    const cand = tryLayout(targetRooms, R);
    if (cand) { rooms = cand; break; }
  }
  if (!rooms) rooms = tryLayout(targetRooms, mulberry(999), true);
  RUN.rooms = rooms;
  RUN.roomTex = buildRoomTex(RUN.theme);
  // 楼层入口 = start 房
  RUN.curKey = '0,0';
  const start = rooms['0,0'];
  start.visited = true; markSeen(start);
  for (const k in rooms) buildRoom(rooms[k]);
  P.x = CFG.CENTER.x; P.y = CFG.CENTER.y;
  MUS.start(RUN.theme, false);
  bigBanner('第 ' + (floorIdx + 1) + ' 层 · ' + FLOOR_NAMES[floorIdx], '', '#e8d8b0', 2);
}
function tryLayout(n, R, force) {

    return c;
  };
  while (count < n && guard++ < 900) {
    const keys = Object.keys(rooms);
    const key = keys[Math.floor(R() * keys.length)];
    const [x, y] = key.split(',').map(Number);
    const d = SIDES[Math.floor(R() * 4)];
    const nx = x + DIRV[d][0], ny = y + DIRV[d][1], nk = nx + ',' + ny;
    if (rooms[nk]) continue;
    if (Math.abs(nx) > 4 || Math.abs(ny) > 3) continue;
    const nb = nbCount(nx, ny);
    if (nb > 1 && R() < 0.72) continue;
    if (R() < 0.14) continue;
    rooms[nk] = mkRoom(nx, ny, 'normal');
    count++;
  }
  if (count < n - 2 && !force) return null;
  // BFS 距离
  const distMap = { '0,0': 0 };
  const queue = ['0,0'];
  while (queue.length) {
    const k = queue.shift();
    const [x, y] = k.split(',').map(Number);
    for (const d of SIDES) {
      const nk = (x + DIRV[d][0]) + ',' + (y + DIRV[d][1]);
      if (rooms[nk] && distMap[nk] === undefined) { distMap[nk] = distMap[k] + 1; queue.push(nk); }
    }
  }
  // 死胡同分类
  const deadEnds = Object.keys(rooms).filter(k => {
    if (k === '0,0') return false;
    const [x, y] = k.split(',').map(Number);
    return nbCount(x, y) === 1;
  }).sort((a, b) => distMap[b] - distMap[a]);
  if (deadEnds.length < 3) return null;
  rooms[deadEnds[0]].type = 'boss';
  rooms[deadEnds[1]].type = 'treasure';
  rooms[deadEnds[2]].type = 'shop';
  // 挑战房：第 2 层起 80% 出现，优先占第 4 个死胡同，否则占用邻居最少的普通房
  if (RUN.floorIdx >= 1 && R() < 0.8) {
    let cKey = deadEnds.length >= 4 ? deadEnds[3] : null;
    if (!cKey) {
      let bestN = 99;
      for (const k of Object.keys(rooms)) {
        if (rooms[k].type !== 'normal') continue;
        const [x, y] = k.split(',').map(Number);
        const nb = nbCount(x, y);

    let nb = 0, nbBoss = false;
    for (const d of SIDES) {

      if (rooms[nk]) { nb++; if (rooms[nk].type === 'boss') nbBoss = true; }

}

function solidObst(room) { return room.obst.filter(o => o.kind === 'rock' || o.kind === 'poop' || o.kind === 'fire' || o.kind === 'tnt'); }

    P.coins -= ped.price; SFX.buy();
  }
  if (ped.active) {
    const old = P.active;
    P.active = ped.item;
    P.activeCharges = ACTIVES[ped.item].charges;
    banner('主动道具：' + ACTIVES[ped.item].name, ACTIVES[ped.item].desc, '#c9a8ff');
    SFX.item();
    if (old) { ped.item = old; ped.price = 0; return; }
  } else {
    RUN.stats.itemsGot++;
    giveItem(ped.item);
  }
  room.peds.splice(idx, 1);
}
/* ---------- 空格购买：范围内最近的定价商品 ---------- */
function shopBuyTarget(room) {
  let best = null, bd = 48;
  for (const ped of room.peds) {
    if (!ped.item || ped.price <= 0) continue;
    const d = dist2(P.x, P.y, ped.x, ped.y - 10);
    if (d < bd) { bd = d; best = { kind: 'ped', obj: ped }; }
  }
  for (const pk of room.pickups) {
    if (pk.price <= 0) continue;
    const d = dist2(P.x, P.y, pk.x, pk.y);
    if (d < bd) { bd = d; best = { kind: 'pk', obj: pk }; }
  }
  return best;
}
function tryShopBuy(room) {
  const t = shopBuyTarget(room);
  if (!t) return false;
  if (t.kind === 'ped') {
    tryBuyPedestal(t.obj, room, room.peds.indexOf(t.obj));
  } else if (tryTakePickup(t.obj)) {
    room.pickups.splice(room.pickups.indexOf(t.obj), 1);
  }
  return true;
}
/* ---------- 主动道具使用 ---------- */
function useActive() {
  if (!P.active) return;
  const A = ACTIVES[P.active];
  if (P.activeCharges < A.charges) { SFX.err(); return; }
  const room = curRoom();
  P.activeCharges = 0;
  const targets = room.enemies.slice(); if (room.boss) targets.push(room.boss);
  switch (P.active) {
    case 'laser': {
      RUN.lasers.push({ x: P.x, y: P.y - 8, dx: P.aimX, dy: P.aimY, t: 0, life: 0.4 });
      SFX.laser(); G.shakeAdd(4);
      for (const e of targets) {
        const px = e.x - P.x, py = e.y - P.y;
        const proj = px * P.aimX + py * P.aimY;
        if (proj > 0) {
          const perp = Math.abs(px * P.aimY - py * P.aimX);
          if (perp < 34) damageEnemy(e, 45, {});
        }
      }
      break;
    }
    case 'book':
      SFX.boom(); G.whiteFlash = 0.5;
      for (const e of targets) damageEnemy(e, 40, {});
      break;
    case 'time':
      SFX.tp();
      for (const e of targets) e.frozenT = Math.max(e.frozenT || 0, 3.5);
      addPart({ x: P.x, y: P.y, life: 0.6, size: 200, col: '#bfe8ff', type: 'ring' });
      break;
    case 'cookie':
      P.hp = Math.min(P.maxHp, P.hp + 2); SFX.heart();
      addFloat(P.x, P.y - 24, '+1 红心', '#8f8');
      break;
    case 'bombbag':
      RUN.bombs.push({ x: P.x, y: P.y, fuse: 1.2, r: CFG.BOMB.R * 1.5, dmg: 95, big: true });
      SFX.bombSet(); break;
    case 'fear':
      SFX.roar(); G.shakeAdd(5);
      for (const e of targets) {
        e.fearT = 3;
        const a = Math.atan2(e.y - P.y, e.x - P.x);
        e.kx = Math.cos(a) * 300; e.ky = Math.sin(a) * 300;
        damageEnemy(e, 10, {});
      }
      break;
    case 'cherry':
      for (let i = 0; i < 3; i++) {
        const a = rnd(TAU);
        RUN.bombs.push({ x: P.x + Math.cos(a) * 50, y: P.y + Math.sin(a) * 50, fuse: 0.9 + i * 0.3, r: 56, dmg: 42, big: false });
      }
      SFX.bombSet(); break;
    case 'gravity': {
      SFX.tp();
      const cx2 = P.x, cy2 = P.y;
      for (const e of targets) {
        const a = Math.atan2(cy2 - e.y, cx2 - e.x);
        e.kx = Math.cos(a) * 420; e.ky = Math.sin(a) * 420;
        e.stunT = Math.max(e.stunT || 0, 1.5);
        damageEnemy(e, 15, {});
      }
      break;
    }
    /* ===== 新增主动道具 ===== */
    case 'bible': {
      SFX.laser(); G.whiteFlash = 0.3;
      const n = 12;
      for (let k = 0; k < n; k++) {
        const a = k / n * TAU;
        RUN.tears.push({
          x: P.x + Math.cos(a) * 14, y: P.y + Math.sin(a) * 14 - 6,
          vx: Math.cos(a) * CFG.TEAR.SPD * 1.1, vy: Math.sin(a) * CFG.TEAR.SPD * 1.1,
          t: 0, life: P.S.range * 0.9, dmg: P.S.dmg * 1.2, r: 7 * P.S.tearScale, scale: P.S.tearScale,
          pierce: 2, homing: false, spectral: true, fire: false, ice: false, poison: false,
          bombBlast: false, knock: P.S.knock, hitSet: new Set(), dead: false, small: false, holy: true
        });
      }
      break;
    }
    case 'skelkey': {
      let opened = false;
      for (const d of SIDES) {
        const door = room.doors[d];
        if (door && door.kind === 'key' && door.locked) { door.locked = false; opened = true; }
      }
      if (opened) { refreshDoors(room); SFX.unlockJ(); banner('骷髅钥匙：所有门已解锁', '', '#ffd94d'); }
      else banner('本房间没有锁着的门，+1 钥匙', '', '#a8d0ff');
      P.keys++;
      break;
    }
    case 'blink': {
      SFX.tp(); addSmoke(P.x, P.y, 8, '#5a4a8a');
      const I = CFG.INNER;
      for (let tries = 0; tries < 24; tries++) {
        const nx = rnd(I.x + 60, I.x + I.w - 60), ny = rnd(I.y + 60, I.y + I.h - 60);
        const cell = cellOf(nx, ny);
        const onObst = room.obst.some(o => o.c === cell.c && o.r === cell.r && o.kind !== 'spike');
        const nearFoe = room.enemies.some(e => dist2(e.x, e.y, nx, ny) < 90) || (room.boss && dist2(room.boss.x, room.boss.y, nx, ny) < 120);
        if (!onObst && !nearFoe) { P.x = nx; P.y = ny; break; }
      }
      P.invuln = Math.max(P.invuln, 1.0);
      addPart({ x: P.x, y: P.y, life: 0.5, size: 80, col: '#c9b8ff', type: 'ring' });
      break;
    }
    case 'guill': {
      let tgt = null, bd = 1e9;
      for (const e of targets) { const d = dist2(P.x, P.y, e.x, e.y); if (d < bd) { bd = d; tgt = e; } }
      if (tgt) {
        SFX.boom(); G.shakeAdd(6);

        damageEnemy(tgt, 80, { knock: 2 });
      } else SFX.err();
      break;
    }
  }
}
/* ---------- 玩家眼泪 ---------- */
function updateTears(dt) {
  const room = curRoom(), S = P.S;
  for (let i = RUN.tears.length - 1; i >= 0; i--) {
    const t = RUN.tears[i];
    t.t += dt;
    // 追踪
    if (t.homing) {
      const tgt = nearestEnemy(t.x, t.y, 280);
      if (tgt) {
        const want = Math.atan2(tgt.y - t.y, tgt.x - t.x);
        const cur = Math.atan2(t.vy, t.vx);
        let da = want - cur;
        while (da > Math.PI) da -= TAU; while (da < -Math.PI) da += TAU;
        const turn = clamp(da, -7 * dt * (S.homingBoost || 1), 7 * dt * (S.homingBoost || 1));
        const sp = Math.hypot(t.vx, t.vy);
        const na = cur + turn;
        t.vx = Math.cos(na) * sp; t.vy = Math.sin(na) * sp;
      }
    }
    t.x += t.vx * dt; t.y += t.vy * dt;
    const I = CFG.INNER;
    let dead = false;
    if (t.x < I.x - 8 || t.x > I.x + I.w + 8 || t.y < I.y - 8 || t.y > I.y + I.h + 8) dead = true;
    // 障碍碰撞
    if (!dead && !t.spectral) {
      for (const o of solidObst(room)) {
        const ox = tileCX(o.c), oy = tileCY(o.r);
        if (o.kind === 'fire') {
          if (dist2(t.x, t.y, ox, oy - 8) < 20 + t.r) {
            // 火堆可被打灭：冰泪 2 倍伤害
            o.hp -= t.ice ? 2 : 1;
            addPart({ x: ox, y: oy - 16, vy: -40, life: 0.35, size: 4, col: '#f2913a', grav: 60, type: 'dot' });
            if (o.hp <= 0) {
              room.obst.splice(room.obst.indexOf(o), 1);
              addSmoke(ox, oy - 10, 4, '#f2913a'); SFX.splash();
              if (chance(0.22 + S.luck * 0.08)) room.pickups.push(mkPickup(chance(0.12) ? 'nickel' : 'coin', ox, oy));
            }
            dead = true; break;
          }
        } else if (o.kind === 'tnt') {
          if (dist2(t.x, t.y, ox, oy) < 20 + t.r) {
            // 烈焰泪直接引爆木桶
            o.hp = t.fire ? 0 : o.hp - 1;
            if (o.hp <= 0) {
              room.obst.splice(room.obst.indexOf(o), 1);
              // 延迟一小段引爆，允许连锁
              RUN.bombs.push({ x: ox, y: oy, fuse: 0.3, r: 74, dmg: 52, big: false });
            } else {
              addPart({ x: ox, y: oy - 20, vy: -30, life: 0.3, size: 4, col: '#d9c9a0', grav: 100, type: 'dot' });
            }
            dead = true; break;
          }
        } else if (dist2(t.x, t.y, ox, oy) < 18 + t.r) {
          if (o.kind === 'poop') {
            o.hp--; addPart({ x: ox, y: oy, vy: -30, life: 0.4, size: 5, col: '#6b4d2b', grav: 200, type: 'dot' });
            if (o.hp <= 0) {
              room.obst.splice(room.obst.indexOf(o), 1);
              addSmoke(ox, oy, 4, '#7a5a34');
              if (chance(0.35 + S.luck * 0.1)) room.pickups.push(mkPickup(chance(0.12) ? 'nickel' : 'coin', ox, oy));
            }
          }
          dead = true; break;
        }
      }
    }
    // 命中敌人
    if (!dead) {
      const targets = [];
      for (const e of room.enemies) if (!t.hitSet.has(e)) targets.push(e);
      if (room.boss && room.boss.hp > 0 && !t.hitSet.has(room.boss)) targets.push(room.boss);
      for (const e of targets) {
        if (e.deadT !== undefined) continue;
        const rr2 = e.r + t.r;
        if (dist2(t.x, t.y, e.x, e.y - (e.z || 0)) < rr2) {
          const crit = chance(S.crit + S.luck * 0.03);
          let dmg = t.dmg * (crit ? 2 : 1);
          damageEnemy(e, dmg, { dirX: t.vx, dirY: t.vy, knock: t.knock, crit, fire: t.fire, ice: t.ice, poison: t.poison });
          if (S.thermoShock && chance(0.2)) explode(t.x, t.y, 44, t.dmg * 0.8, false);
          if (S.bombBlast && !t.small) explode(t.x, t.y, 36 * (S.blastScale || 1), t.dmg * 0.7, false);
          if (crit && S.bloodRain && !t.small) {
            for (let k = 0; k < 4; k++) {
              const a = k / 4 * TAU + rnd(0.5);
              RUN.tears.push({ x: t.x, y: t.y, vx: Math.cos(a) * 220, vy: Math.sin(a) * 220, t: 0, life: 0.4, dmg: t.dmg * 0.4, r: 4, scale: 0.8, pierce: 0, homing: false, spectral: true, fire: t.fire, ice: t.ice, poison: t.poison, bombBlast: false, knock: 0, hitSet: new Set([e]), dead: false, small: true });
            }
          }
          t.hitSet.add(e);
          if (t.pierce > 0) t.pierce--;
          else { dead = true; }
          break;
        }
      }
    }
    if (t.t >= t.life) dead = true;
    if (dead) {
      // 溅射之泪：落地时对周围敌人造成 50% 范围伤害
      if (S.splashDmg && !t.small && t.t > 0.05) {
        const sr = 46 * (S.tearScale || 1);
        for (const e of room.enemies) {
          if (t.hitSet.has(e) || e.deadT !== undefined) continue;
          if (dist2(t.x, t.y, e.x, e.y - (e.z || 0)) < sr + e.r) {
            damageEnemy(e, t.dmg * 0.5, { dirX: e.x - t.x, dirY: e.y - t.y, knock: 1, fire: t.fire, ice: t.ice, poison: t.poison });
          }
        }
        if (room.boss && room.boss.hp > 0 && !t.hitSet.has(room.boss) && dist2(t.x, t.y, room.boss.x, room.boss.y) < sr + room.boss.r) {
          damageEnemy(room.boss, t.dmg * 0.5, { dirX: room.boss.x - t.x, dirY: room.boss.y - t.y });
        }
        addPart({ x: t.x, y: t.y, life: 0.22, size: sr, col: 'rgba(154,201,232,0.4)', type: 'ring' });
      }
      addSplash(t.x, t.y, t.fire ? '#f2913a' : '#9ac9e8');
      if (!t.quiet) SFX.splash();
      RUN.tears.splice(i, 1);
    }
  }
}
/* ---------- 敌人伤害 / 状态 ---------- */
function damageEnemy(e, dmg, opts = {}) {
  if (e.hp <= 0) return;
  RUN.stats.dmg += dmg;
  e.hp -= dmg;
  e.flash = 0.12;
  if (opts.knock && !e.noKnock) {
    const l = Math.hypot(opts.dirX || 0, opts.dirY || 0) || 1;
    const k = 90 + opts.knock * 70;
    e.kx = (e.kx || 0) + (opts.dirX / l) * k;
    e.ky = (e.ky || 0) + (opts.dirY / l) * k;
  }
  if (opts.crit) { addFloat(e.x, e.y - e.r - 8, Math.round(dmg) + '!', '#ff9a3a'); }
  if (opts.fire) e.burnT = Math.max(e.burnT || 0, 2.2);
  if (opts.poison) e.poisonT = Math.max(e.poisonT || 0, 3.2);
  if (opts.ice) {
    e.slowT = Math.max(e.slowT || 0, 1.6);
    if (P.S.petrify && chance(P.S.petrifyBoost ? 0.16 : 0.08)) e.frozenT = Math.max(e.frozenT || 0, 1.2);
    else if (chance(0.05)) e.frozenT = Math.max(e.frozenT || 0, 0.9);
  }
  SFX.hit();
  if (e.hp <= 0) killEnemy(e);
}
function killEnemy(e) {
  const room = curRoom(), S = P.S;
  addBlood(e.x, e.y, e.elite ? 16 : 9);
  SFX.squish();
  if (e.isBoss) { onBossDeath(e); return; }
  RUN.stats.kills++;
  const idx = room.enemies.indexOf(e);
  if (idx >= 0) room.enemies.splice(idx, 1);
  // 特殊死亡效果
  if (e.type === 'fatty') {
    for (let k = 0; k < 8; k++) {
      const a = k / 8 * TAU;
      fireEB(e.x, e.y, a, 190);
    }
  }
  if (e.type === 'spitter') {
    RUN.creeps.push({ x: e.x, y: e.y, r: 34, life: 4, kind: 'acid' });
  }
  // 掉落（金币掉率上调，让前期商店有购买力）
  const drop = e.elite ? 1 : 0;
  const roll = Math.random(), luck = S.luck + S.coinLuck * 0.2;
  if (drop || roll < 0.45 + luck * 0.12) {
    room.pickups.push(mkPickup(chance(0.12) ? 'nickel' : 'coin', e.x, e.y));
  } else if (roll < 0.52 + luck * 0.12) {
    room.pickups.push(mkPickup(chance(0.5) ? 'bomb' : 'key', e.x, e.y));
  } else if (roll < 0.58) {
    room.pickups.push(mkPickup(chance(0.5) ? 'halfheart' : 'soulheart', e.x, e.y));
  }
  // 新道具钩子：吸血（击杀回血）与腐尸（死亡留毒圈）
  if (S.leech && chance(S.leechBoost ? 0.16 : 0.08)) { P.hp = Math.min(P.maxHp, P.hp + 1); addFloat(e.x, e.y - 18, '+半心', '#8f8'); }
  if (S.rotOnDeath) RUN.creeps.push({ x: e.x, y: e.y, r: 30, life: 3, kind: 'acid' });
  checkRoomClear(room);
}
/* ---------- 玩家受伤 / 死亡 ---------- */
/* 以撒式受击伤害：第 1-4 层（前两章）扣半心，第 5-8 层（后两章）扣一整心 */
function hitHalves() { return RUN.floorIdx <= 3 ? 1 : 2; }
function hurtPlayer(halves, src) {
  if (P.invuln > 0 || RUN.over) return false;
  if (P.S.block && chance(P.S.block)) {
    addFloat(P.x, P.y - 24, '格挡！', '#a8e0ff'); SFX.key();
    P.invuln = 0.5; return false;
  }
  if (P.armor && chance(P.armor)) halves = Math.max(1, Math.ceil(halves / 2));
  G.redFlash = 1; G.shakeAdd(5); SFX.hurt();
  P.invuln = CFG.PLAYER.INVULN;
  // 荆棘之甲：受伤时对周围敌人造成反击伤害
  if (P.S.revenge) {
    const room = curRoom();
    const foes = room.enemies.slice(); if (room.boss) foes.push(room.boss);
    for (const e of foes) {
      if (dist2(P.x, P.y, e.x, e.y) < 130) {
        damageEnemy(e, 6 + P.S.dmg * 0.6, { knock: 2, dirX: e.x - P.x, dirY: e.y - P.y, fire: !!P.S.revengeFire });
      }
    }
    addPart({ x: P.x, y: P.y, life: 0.35, size: 120, col: P.S.revengeFire ? '#f2913a' : '#c94a8a', type: 'ring' });
  }
  while (halves > 0) {
    if (P.soul > 0) { P.soul--; halves -= 2; continue; }
    if (P.hp > 0) { P.hp--; halves--; continue; }
    break;
  }
  if (P.hp <= 0 && P.soul <= 0) {
    if (META.data.up.revive > 0 && !P.reviveUsed) {
      P.reviveUsed = true;
      P.hp = Math.max(2, Math.floor(P.maxHp / 2));
      bigBanner('九命复生！', '你还剩下最后一条命……', '#ffd94d');
      P.invuln = 2.5;
      return true;
    }
    dieGame();
  }
  return true;
}
function dieGame() {
  RUN.over = true;
  addBlood(P.x, P.y, 24);
  SFX.die();
  grantSouls();
  checkUnlocks();

  setTimeout(() => { G.state = 'dead'; MUS.stop(); }, 700);

}
function grantSouls() {
  const s = Math.round(RUN.stats.kills * 0.5 + RUN.floorIdx * 12 + RUN.stats.bossKills * 30 + (RUN.won ? 150 : 0));

function checkUnlocks() {

/* ---------- 敌方子弹 ---------- */
function fireEB(x, y, ang, spd, opts = {}) {

function updateEBullets(dt) {

/* ---------- 炸弹 ---------- */
function updateBombs(dt) {

function explode(x, y, r, dmg, hurtPlayerToo) {

    } else if (b.state === 'ring') {
      if (b.t <= 0) {

        fireEB(b.x, b.y, b.sprA, 155, { col: '#8a7a4a' });

      moveToward(b, CFG.CENTER.x, CFG.CENTER.y - 60, 30, dt);

  gemini(b, dt, room) {

  },
  chub(b, dt, room) {

      moveToward(b, P.x, P.y, 40, dt);

      }

  },
  monstro(b, dt, room) {
    if (b.state === 'idle') {
      b.y += Math.sin(b.animT * 2) * 10 * dt;
      if (b.t <= 0) {
        const r = Math.random();

        else if (b.phase >= 3 && r < 0.7) { b.state = 'rain'; b.t = 2.4; }
        else { b.state = 'spray'; b.t = 0.8; }
      }
    } else if (b.state === 'spray') {
      if (b.t <= 0) {
        const a = Math.atan2(P.y - b.y, P.x - b.x);
        const n = b.phase >= 2 ? 7 : 5;
        for (let k = 0; k < n; k++) fireEB(b.x, b.y - 10, a + (k - (n - 1) / 2) * 0.24, 205, { col: '#7a8ac9' });
        SFX.squish();
        b.sprays = (b.sprays || 0) + 1;
        if (b.sprays % 2 === 0) { b.state = 'idle'; b.t = rnd(1.2, 1.8); }
        else b.t = 0.7;
      }
    } else if (b.state === 'air') {
      if (b.t <= 0 && !b.warned) {

        b.t = 0.8;
      }
      if (b.warned && b.t <= 0) {
        b.warned = false;
        b.x = b.strikes[0] ? b.strikes[0].x : P.x; // 落点

      }
      // 简化跳跃：隐身+落点圈

        b.airT = (b.airT || 0) + dt;
      }
      if (b.warned && b.t <= 0) { /* handled above */ }
    } else if (b.state === 'rain') {
      b.rainT = (b.rainT || 0) - dt;
      if (b.rainT <= 0) {
        b.rainT = 0.28;
        b.strikes.push({ x: rnd(CFG.INNER.x + 40, CFG.INNER.x + CFG.INNER.w - 40), y: rnd(CFG.INNER.y + 30, CFG.INNER.y + CFG.INNER.h - 30), t: 0.6, kind: 'rain' });
      }
      if (b.t <= 0) { b.state = 'idle'; b.t = rnd(1.0, 1.6); }

  },
  widow(b, dt, room) {

        addSmoke(b.x, b.y, 4, '#573a73'); SFX.tp();

  mom(b, dt, room) {

          else if (r < 0.65) { b.state = 'laser'; b.t = 0.4; }

        for (let k = 0; k < n; k++) {
          const a = rnd(TAU);
          room.enemies.push(spawnEnemy(chance(0.6) ? 'gaper' : 'charger', b.x + Math.cos(a) * 60, b.y + Math.sin(a) * 60, false, RUN.floorIdx));
        }
        SFX.tp(); addSmoke(b.x, b.y, 6, '#7a1f2f');

      for (let k = 0; k < 5; k++) b.strikes.push({ x: rnd(CFG.INNER.x + 40, CFG.INNER.x + CFG.INNER.w - 40), y: rnd(CFG.INNER.y + 30, CFG.INNER.y + CFG.INNER.h - 30), t: 0.7 + k * 0.12, kind: 'stomp' });
      b.state = 'idle'; b.t = rnd(2.0, 2.8);
    }
  },
  /* ===== 新增 Boss AI ===== */
  // 门之魔：生成传送门，从随机位置发射弹幕
  gate(b, dt, room) {
    const I = CFG.INNER;
    if (b.state === 'idle') {
      moveToward(b, I.x + I.w / 2 + Math.cos(b.animT * 0.7) * 180, I.y + I.h / 2 + Math.sin(b.animT * 0.9) * 80, 34, dt);
      if (b.t <= 0) {
        const r = Math.random();
        if (r < 0.55) { b.state = 'portals'; b.t = 1.8; }
        else if (b.phase >= 2) { b.state = 'volley'; b.t = 1.2; }
        else { b.state = 'portals'; b.t = 1.8; }
      }
    } else if (b.state === 'portals') {
      // 开门瞬间生成 2-3 个传送门，短暂延迟后向玩家喷射
      if (!b.portals) {
        b.portals = [];
        const n = b.phase >= 3 ? 3 : 2;
        for (let k = 0; k < n; k++) {
          b.portals.push({ x: rnd(I.x + 70, I.x + I.w - 70), y: rnd(I.y + 70, I.y + I.h - 70), fired: false, d: rnd(0.3, 1.1) });
        }
        SFX.tp();
      }
      b.portalT = (b.portalT || 0) + dt;
      for (const p of b.portals) {
        if (!p.fired && b.portalT >= p.d) {
          p.fired = true;
          addSmoke(p.x, p.y, 4, '#7a5aa0');
          const base = Math.atan2(P.y - p.y, P.x - p.x);
          const shots = b.phase >= 2 ? 4 : 3;
          for (let k = 0; k < shots; k++) fireEB(p.x, p.y, base + (k - (shots - 1) / 2) * 0.24, 175, { col: '#9a6bce' });
        }
      }
      if (b.t <= 0) { b.portals = null; b.portalT = 0; b.state = 'idle'; b.t = rnd(1.5, 2.2); }
    } else if (b.state === 'volley') {
      b.emitT = (b.emitT || 0) - dt;
      if (b.emitT <= 0) {
        b.emitT = 0.2;
        const a = Math.atan2(P.y - b.y, P.x - b.x) + rnd(-0.35, 0.35);
        fireEB(b.x, b.y, a, 210, { col: '#c98ace', r: 6 });
      }
      if (b.t <= 0) {
        const n = b.phase >= 3 ? 11 : 8;
        for (let k = 0; k < n; k++) fireEB(b.x, b.y, k / n * TAU + b.animT, 160, { col: '#9a6bce' });
        b.state = 'idle'; b.t = rnd(1.6, 2.3);
      }
    }

function drawEnemy(g, e) {

  g.fillStyle = 'rgba(0,0,0,0.35)';

  g.rotate(Math.sin(e.animT * 6) * 0.05);
  const w = e.r * 2 * 1.6, h = e.r * 2 * 1.6;
  g.drawImage(spr, -w / 2, -h / 2, w, h);

    g.strokeStyle = 'rgba(200,120,255,0.7)'; g.lineWidth = 3;

  }

function drawBossOverlays(g, b) {

    g.fillStyle = `rgba(200,40,40,${0.2 + k * 0.3})`;
    g.beginPath(); g.arc(s.x, s.y, (s.kind === 'stomp' ? 60 : 34) * (0.6 + k * 0.4), 0, TAU); g.fill();

      g.fillStyle = '#e0c8c8'; g.strokeStyle = '#160f0c'; g.lineWidth = 3;

  for (const bm of b.beams) {

      g.lineWidth = 4; g.setLineDash([12, 10]);

function fmtTime(s) { const m = Math.floor(s / 60), ss = Math.floor(s % 60); return m + ':' + (ss < 10 ? '0' : '') + ss; }

/* ---------- 角色绘制（菜单与游戏共用） ---------- */
const CHAR_LOOK = {
  tear:  { skin: '#ecd2b2', body: '#dcc2a0' },
  vivi:  { skin: '#f2d8c8', body: '#5a3a7a' },
  iron:  { skin: '#d8cdb8', body: '#8a8a94' },
  blind: { skin: '#e2d4c2', body: '#c9b8a8' }
};
function drawChar(g, id, x, y, s, opt = {}) {
  const L = CHAR_LOOK[id];
  g.save(); g.translate(x, y); g.scale(s, s);
  if (!opt.noShadow) { g.fillStyle = 'rgba(0,0,0,0.35)'; g.beginPath(); g.ellipse(0, 16, 12, 4.5, 0, 0, TAU); g.fill(); }
  const step = opt.moving ? Math.sin(opt.walkT || 0) * 4 : 0;
  g.fillStyle = L.body; g.strokeStyle = '#160f0c'; g.lineWidth = 2;
  g.beginPath(); g.ellipse(-5, 11 + step, 4.5, 3, 0, 0, TAU); g.fill(); g.stroke();
  g.beginPath(); g.ellipse(5, 11 - step, 4.5, 3, 0, 0, TAU); g.fill(); g.stroke();
  blob(g, 0, 3, 9.5, L.body);
  blob(g, 0, -11, 14, L.skin);
  const lookX = (opt.aimX || 0) * 2.2, lookY = (opt.aimY || 0) * 1.6;
  if (opt.dead) {
    g.strokeStyle = '#3a2a20'; g.lineWidth = 2.2;
    for (const ex of [-5.5, 5.5]) {
      g.beginPath(); g.moveTo(ex - 3, -15); g.lineTo(ex + 3, -9); g.moveTo(ex + 3, -15); g.lineTo(ex - 3, -9); g.stroke();
    }
    g.beginPath(); g.ellipse(0, -4, 3.5, 2.6, 0, 0, TAU); g.fillStyle = '#5a1414'; g.fill();
  } else if (id === 'blind') {
    g.fillStyle = '#26262e';
    rr(g, -12, -17, 24, 7, 3); g.fill();
    g.strokeStyle = '#4a4a56'; g.lineWidth = 1.5;
    g.beginPath(); g.moveTo(-9, -15.5); g.lineTo(-4, -12.5); g.moveTo(9, -15.5); g.lineTo(4, -12.5); g.stroke();
    g.fillStyle = '#c98a8a'; g.beginPath(); g.ellipse(0, -4.5, 3, 2, 0, 0, TAU); g.fill();
  } else {
    eye(g, -5.5, -13, 4, lookX, lookY);
    eye(g, 5.5, -13, 4, lookX, lookY);
    g.fillStyle = '#b06a5a'; g.beginPath(); g.ellipse(0, -4.5, 3, 1.8, 0, 0, TAU); g.fill();
  }
  if (opt.crying) {
    g.fillStyle = '#9ac9e8'; g.strokeStyle = '#3a6a8a'; g.lineWidth = 1.5;
    for (const ex of [-5.5, 5.5]) { g.beginPath(); g.ellipse(ex + lookX * 0.6, -7, 2.4, 3.4, 0, 0, TAU); g.fill(); g.stroke(); }
  }
  if (id === 'vivi') {
    g.fillStyle = '#4a2a6a'; g.strokeStyle = '#160f0c'; g.lineWidth = 2.5;
    g.beginPath(); g.moveTo(-15, -20); g.quadraticCurveTo(0, -46, 15, -20); g.closePath(); g.fill(); g.stroke();
    g.fillStyle = '#5a3a7a'; g.beginPath(); g.ellipse(0, -20, 16, 4.5, 0, 0, TAU); g.fill(); g.stroke();
    g.fillStyle = '#ffd94d'; g.beginPath(); g.arc(0, -34, 2.5, 0, TAU); g.fill();
  }
  if (id === 'iron') {
    g.fillStyle = '#9a9aa4'; g.strokeStyle = '#2c2c33'; g.lineWidth = 2.5;
    g.beginPath(); g.arc(0, -12, 14.5, Math.PI, 0); g.closePath(); g.fill(); g.stroke();
    g.fillRect(-2.5, -26, 5, 14); g.strokeRect(-2.5, -26, 5, 14);
  }
  g.restore();
}
function drawPlayer(g) {
  if (!P) return;
  const blink = P.invuln > 0 && Math.floor(G.t * 16) % 2 === 0;
  g.save();
  if (blink) g.globalAlpha = 0.35;
  drawChar(g, P.char, P.x, P.y, 1.08, {
    walkT: P.walkT, moving: P.moving, aimX: P.aimX, aimY: P.aimY,
    crying: P.shootT > 0 || (P.hp <= 2 && chance(0.02)), dead: RUN.over
  });
  g.restore();
  for (const orb of P.orbits) drawTearSprite(g, orb.x, orb.y, 6, '#9ac9e8', '#3a6a8a');

    g.strokeStyle = `rgba(200,120,220,${0.12 + Math.sin(G.t * 3) * 0.05})`;
    g.lineWidth = 2; g.beginPath(); g.arc(P.x, P.y, P.S.magnetR, 0, TAU); g.stroke();
  }
}
function drawTearSprite(g, x, y, r, col, line) {
  blob(g, x, y, r, col, line, 2.5);
  g.fillStyle = 'rgba(255,255,255,0.5)';

/* ---------- 门 / 障碍 / 拾取物 ---------- */
function drawDoors(g, room, T) {
  for (const side of SIDES) {
    const door = room.doors[side];
    if (!door || door.hidden) continue;
    const D = CFG.DOORS[side];
    let x, y, w, h;
    if (side === 'N') { x = D.x - CFG.DOORW / 2; y = CFG.ROOMY; w = CFG.DOORW; h = CFG.WALL; }
    if (side === 'S') { x = D.x - CFG.DOORW / 2; y = CFG.ROOMY + CFG.WALL + CFG.INNER.h; w = CFG.DOORW; h = CFG.WALL; }
    if (side === 'W') { x = CFG.ROOMX; y = D.y - CFG.DOORW / 2; w = CFG.WALL; h = CFG.DOORW; }
    if (side === 'E') { x = CFG.ROOMX + CFG.WALL + CFG.INNER.w; y = D.y - CFG.DOORW / 2; w = CFG.WALL; h = CFG.DOORW; }
    let frame = T.door, icon = null;
    if (door.kind === 'boss') { frame = '#5a1c1c'; icon = 'skull'; }
    else if (door.kind === 'key') { frame = '#8a6d2a'; icon = door.locked ? 'keyp' : null; }
    else if (door.kind === 'shop') { frame = '#3a5a8a'; icon = 'coin'; }
    else if (door.kind === 'challenge') { frame = '#7a4218'; icon = 'swords'; }
    else if (door.kind === 'secret') frame = '#4a3a6a';
    g.fillStyle = frame; g.fillRect(x, y, w, h);
    g.strokeStyle = 'rgba(0,0,0,0.55)'; g.lineWidth = 3; g.strokeRect(x + 1.5, y + 1.5, w - 3, h - 3);
    const m = 8;
    if (door.open) {
      g.fillStyle = '#080604';
      rr(g, x + m, y + m, w - m * 2, h - m * 2, 14); g.fill();
      g.fillStyle = `rgba(190,160,110,${0.10 + Math.sin(G.t * 2.5) * 0.05})`;
      rr(g, x + m + 5, y + m + 5, w - m * 2 - 10, h - m * 2 - 10, 10); g.fill();
    } else {
      g.fillStyle = shade(frame, -16);
      rr(g, x + m, y + m, w - m * 2, h - m * 2, 8); g.fill();
      g.strokeStyle = 'rgba(0,0,0,0.45)'; g.lineWidth = 2;
      const horiz = w > h;
      for (let i = 1; i <= 2; i++) {
        g.beginPath();
        if (horiz) { g.moveTo(x + m + 4, y + m + (h - m * 2) * i / 3); g.lineTo(x + w - m - 4, y + m + (h - m * 2) * i / 3); }
        else { g.moveTo(x + m + (w - m * 2) * i / 3, y + m + 4); g.lineTo(x + m + (w - m * 2) * i / 3, y + h - m - 4); }
        g.stroke();
      }
    }
    if (icon) g.drawImage(SPR.icon[icon], x + w / 2 - 13, y + h / 2 - 13, 26, 26);
  }
}
function drawObst(g, room) {
  for (const o of room.obst) {
    const x = tileCX(o.c), y = tileCY(o.r);
    g.fillStyle = 'rgba(0,0,0,0.3)';
    g.beginPath(); g.ellipse(x, y + 16, 20, 7, 0, 0, TAU); g.fill();
    if (o.kind === 'rock') g.drawImage(SPR.rock, x - 28, y - 30);
    else if (o.kind === 'poop') g.drawImage(SPR.poop[clamp(o.hp - 1, 0, 2)], x - 28, y - 30);
    else if (o.kind === 'spike') g.drawImage(SPR.spike, x - 28, y - 30);
    else if (o.kind === 'fire') {
      // 血量越低火越小（5 → 1），火焰底部贴地
      const sc = 0.55 + 0.45 * clamp(o.hp, 1, 5) / 5;
      const fw = 56 * sc, fh = 64 * sc;
      g.drawImage(SPR.fire[Math.floor(G.t * 9) % 4], x - fw / 2, y + 10 - fh * 0.78, fw, fh);
    }
    else if (o.kind === 'tnt') {
      g.drawImage(SPR.tnt, x - 28, y - 30);
      // 受损提示：闪烁引信
      if (o.hp <= 1 && Math.floor(G.t * 6) % 2 === 0) {
        g.fillStyle = '#ffd97a'; g.beginPath(); g.arc(x + 15, y - 22, 3, 0, TAU); g.fill();
      }
    }
  }
}
function drawPrice(g, x, y, price) {
  g.fillStyle = 'rgba(10,8,6,0.8)'; rr(g, x - 22, y, 44, 18, 8); g.fill();

function drawPickups(g, room) {

    if (pk.kind === 'coin') g.drawImage(SPR.coin[fr], x - 12, y - 12, 24, 24);

    else if (pk.kind === 'dime') g.drawImage(SPR.coin[fr], x - 19, y - 19, 38, 38);
    else if (pk.kind === 'key') g.drawImage(SPR.key, x - 13, y - 13, 26, 26);
    else if (pk.kind === 'bomb') g.drawImage(SPR.bombPick, x - 13, y - 13, 26, 26);
    else if (pk.kind === 'heart') g.drawImage(SPR.heart, x - 13, y - 12, 26, 24);
    else if (pk.kind === 'halfheart') g.drawImage(SPR.heartHalf, x - 13, y - 12, 26, 24);
    else if (pk.kind === 'soulheart') g.drawImage(SPR.soulHeart, x - 13, y - 12, 26, 24);
    if (pk.price > 0) drawPrice(g, x, pk.y + 14, pk.price);

function drawPeds(g, room) {
  for (const ped of room.peds) {
    if (!ped.item) continue;

/* ---------- 世界总绘制 ---------- */
function drawWorld(g) {
  const room = curRoom(), T = THEMES[RUN.theme];
  g.drawImage(RUN.roomTex, CFG.ROOMX, CFG.ROOMY);
  drawDoors(g, room, T);
  if (room.trapdoor) {
    g.drawImage(SPR.trapdoor, room.trapdoor.x - 36, room.trapdoor.y - 30);
    const k = (G.t % 1.4) / 1.4;
    g.strokeStyle = `rgba(255,217,77,${0.7 * (1 - k)})`; g.lineWidth = 3;
    g.beginPath(); g.ellipse(room.trapdoor.x, room.trapdoor.y + 4, 20 + k * 26, 12 + k * 16, 0, 0, TAU); g.stroke();
  }
  if (room.type === 'start' && RUN.floorIdx === 0 && RUN.stats.kills === 0) {
    g.font = '15px "Microsoft YaHei"'; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillStyle = 'rgba(240,230,210,0.5)';
    g.fillText('WASD 移动 · 方向键 八向射击 · E 炸弹 · 空格 主动道具', CFG.CENTER.x, CFG.CENTER.y + 90);
  }

    g.beginPath(); g.ellipse(c.x, c.y, c.r, c.r * 0.6, 0, 0, TAU); g.fill();
  }

  if (buyT) {
    const o = buyT.obj;
    const hx = o.x, hy = buyT.kind === 'ped' ? o.y - 82 : o.y - 38;
    g.save();
    g.globalAlpha = 0.8 + Math.sin(G.t * 5) * 0.2;
    g.fillStyle = 'rgba(18,13,7,0.9)'; rr(g, hx - 46, hy - 13, 92, 24, 10); g.fill();
    g.strokeStyle = 'rgba(255,220,120,0.65)'; g.lineWidth = 1.5; rr(g, hx - 46, hy - 13, 92, 24, 10); g.stroke();
    g.fillStyle = '#ffe9a8'; g.font = 'bold 13px "Microsoft YaHei"'; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText('空格 购买', hx, hy);
    g.restore();
  }
  for (const b of RUN.bombs) {
    const br = b.big ? 16 : 11;
    g.fillStyle = 'rgba(0,0,0,0.35)';
    g.beginPath(); g.ellipse(b.x, b.y + br * 0.8, br, br * 0.4, 0, 0, TAU); g.fill();
    blob(g, b.x, b.y, br, '#26262e', '#111116', 2.5);
    if (b.fuse < 0.6 && Math.floor(G.t * 12) % 2 === 0) {
      g.fillStyle = 'rgba(255,255,255,0.55)';
      g.beginPath(); g.arc(b.x, b.y, br, 0, TAU); g.fill();
    }
    g.strokeStyle = '#8a6d4a'; g.lineWidth = 2;
    g.beginPath(); g.moveTo(b.x + 2, b.y - br); g.quadraticCurveTo(b.x + 8, b.y - br - 8, b.x + 12, b.y - br - 6); g.stroke();
    g.fillStyle = Math.floor(G.t * 20) % 2 ? '#ffd97a' : '#f2913a';
    g.beginPath(); g.arc(b.x + 12, b.y - br - 6, 3, 0, TAU); g.fill();
  }
  const es = room.enemies.slice().sort((a, b2) => a.y - b2.y);
  for (const e of es) drawEnemy(g, e);
  if (room.boss) drawBossBody(g, room.boss);
  drawPlayer(g);
  for (const t of RUN.tears) {
    let col = '#9ac9e8', line = '#3a6a8a';
    if (t.fire) { col = '#f2913a'; line = '#8a2a0a'; }
    else if (t.ice) { col = '#bfe8ff'; line = '#3a7a9a'; }
    else if (t.poison) { col = '#8adf4a'; line = '#3a6a1a'; }
    drawTearSprite(g, t.x, t.y, t.r, col, line);
  }
  for (const b of RUN.ebullets) {
    const wob = 1 + Math.sin(G.t * 10 + b.x) * 0.08;
    g.fillStyle = b.col; g.strokeStyle = 'rgba(0,0,0,0.5)'; g.lineWidth = 2;
    g.beginPath(); g.arc(b.x, b.y, b.r * wob, 0, TAU); g.fill(); g.stroke();
    g.fillStyle = 'rgba(255,255,255,0.35)';
    g.beginPath(); g.arc(b.x - b.r * 0.3, b.y - b.r * 0.3, b.r * 0.35, 0, TAU); g.fill();
  }
  for (const l of RUN.lasers) {
    const k = l.t / l.life, wdt = 30 * (1 - k) + 5;
    g.save(); g.translate(l.x, l.y); g.rotate(Math.atan2(l.dy, l.dx));
    const gr = g.createLinearGradient(0, 0, 900, 0);
    gr.addColorStop(0, `rgba(255,250,220,${0.95 * (1 - k)})`);
    gr.addColorStop(1, 'rgba(255,200,80,0)');
    g.fillStyle = gr; g.fillRect(0, -wdt / 2, 900, wdt);
    g.restore();
  }
  if (room.boss) drawBossOverlays(g, room.boss);
  drawParts(g);
  g.drawImage(SPR.vignette, 0, 0);
}
function drawParts(g) {
  for (const p of RUN.parts) {
    const k = 1 - p.t / p.life;
    if (p.type === 'dot') {
      g.globalAlpha = k; g.fillStyle = p.col;
      const s = Math.max(1, p.size * k);
      g.fillRect(p.x - s / 2, p.y - s / 2, s, s);
    } else if (p.type === 'smoke') {
      g.globalAlpha = 0.35 * k; g.fillStyle = p.col;
      g.beginPath(); g.arc(p.x, p.y, p.size * (1.6 - k * 0.6), 0, TAU); g.fill();
    } else if (p.type === 'ring') {
      g.globalAlpha = k; g.strokeStyle = p.col; g.lineWidth = 3 * k + 1;
      g.beginPath(); g.arc(p.x, p.y, p.size * (1 - k), 0, TAU); g.stroke();
    } else if (p.type === 'text') {
      g.globalAlpha = Math.min(1, k * 2);
      g.font = `bold ${p.size}px "Microsoft YaHei"`; g.textAlign = 'center'; g.textBaseline = 'middle';
      g.strokeStyle = 'rgba(0,0,0,0.8)'; g.lineWidth = 3;
      g.strokeText(p.txt, p.x, p.y);
      g.fillStyle = p.col; g.fillText(p.txt, p.x, p.y);
    }
    g.globalAlpha = 1;
  }
}

function drawMinimap(g) {
  let minX = 99, maxX = -99, minY = 99, maxY = -99, any = false;
  for (const k in RUN.rooms) {
    const r = RUN.rooms[k];
    if (!r.seen) continue;
    any = true;
    minX = Math.min(minX, r.gx); maxX = Math.max(maxX, r.gx);
    minY = Math.min(minY, r.gy); maxY = Math.max(maxY, r.gy);
  }
  if (!any) return;
  const cs = 13, pad = 2;
  const w = (maxX - minX + 1) * (cs + pad), h = (maxY - minY + 1) * (cs + pad);
  const x0 = CFG.W - 14 - w, y0 = CFG.HUD + 10;
  g.fillStyle = 'rgba(10,8,6,0.6)'; rr(g, x0 - 6, y0 - 6, w + 12, h + 12, 8); g.fill();
  for (const k in RUN.rooms) {
    const r = RUN.rooms[k];
    if (!r.seen) continue;
    const x = x0 + (r.gx - minX) * (cs + pad), y = y0 + (r.gy - minY) * (cs + pad);
    let col = r.visited ? '#8f8878' : '#4a463c';
    if (r.type === 'boss') col = '#a03030';
    else if (r.type === 'treasure') col = '#c9a83a';
    else if (r.type === 'shop') col = '#4a7ac9';
    else if (r.type === 'secret') col = '#8a5ac9';
    else if (r.type === 'challenge') col = '#c96a2a';
    else if (r.type === 'start') col = '#7a8a6a';
    g.fillStyle = col; g.fillRect(x, y, cs, cs);
    if (k === RUN.curKey) {
      g.strokeStyle = '#fff'; g.lineWidth = 2; g.strokeRect(x - 1.5, y - 1.5, cs + 3, cs + 3);
      g.fillStyle = 'rgba(255,255,255,0.35)'; g.fillRect(x + 2, y + 2, cs - 4, cs - 4);
    }
  }
  g.font = 'bold 13px "Microsoft YaHei"'; g.textAlign = 'right'; g.textBaseline = 'middle';
  g.fillStyle = '#e8dcc0';
  g.fillText('第 ' + (RUN.floorIdx + 1) + ' 层 · ' + FLOOR_NAMES[RUN.floorIdx], CFG.W - 14, y0 + h + 14);
  g.fillStyle = '#9a9aa5';
  g.fillText(fmtTime(G.t - RUN.stats.t0), CFG.W - 14, y0 + h + 34);
}

function wrapText(g, txt, x, y, w, lh, fs) {
  g.font = fs + 'px "Microsoft YaHei"'; g.textAlign = 'left'; g.textBaseline = 'middle';
  let line = '', yy = y;
  for (const ch of txt) {
    if (g.measureText(line + ch).width > w) { g.fillText(line, x, yy); line = ch; yy += lh; }
    else line += ch;
  }
  if (line) g.fillText(line, x, yy);
}

    g.fillStyle = gr; g.fillRect(0, 0, CFG.W, CFG.H);
    for (let i = 0; i < 20; i++) {
      const x = (i * 211 + Math.sin(G.t + i * 2) * 30) % CFG.W;
      const y = (G.t * (26 + i % 5 * 10) + i * 97) % CFG.H;
      g.globalAlpha = 0.5; g.drawImage(SPR.icon.star, x, y, 16, 16); g.globalAlpha = 1;
    }
    drawEndStats(g, true);
    g.drawImage(SPR.vignette, 0, 0);
  }
};

/* ---------- 启动 ---------- */
buildSprites();
G.state = 'menu';
requestAnimationFrame(loop);
</script>
<script>
// Shift+Esc 返回主页（保留游戏原有 ESC 暂停/菜单功能不变）
window.addEventListener('keydown', e => {
  if (e.repeat) return;
  if (e.shiftKey && (e.key === 'Escape' || e.code === 'Escape')) {
    e.preventDefault();
    location.href = '../../index.html';
  }
}, true);
</script>
