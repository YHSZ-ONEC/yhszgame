<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>别按那个键 V2</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#070b10;--panel:#121923;--panel2:#192231;--line:#283447;
  --ink:#e9f0f7;--dim:#92a1b2;--faint:#5d6b7c;
  --mana:#49c7ff;--gold:#f3bd36;--bad:#ef4b55;--good:#4bd37b;--violet:#a879ff;
  --doom:0;
}
html,body{height:100%}
body{
  overflow:hidden;color:var(--ink);
  font-family:"Segoe UI","Microsoft YaHei","PingFang SC",system-ui,sans-serif;
  background:
    radial-gradient(circle at 20% 10%,rgba(73,199,255,.11),transparent 28%),
    radial-gradient(circle at 82% 18%,rgba(239,75,85,.10),transparent 26%),
    #05070a;
  -webkit-font-smoothing:antialiased;
}
#app{height:100vh;display:grid;grid-template-columns:1fr 334px 236px;gap:1px;background:#202a39}
#stage{position:relative;overflow:hidden;background:radial-gradient(circle at 50% 44%,#122130,#05080d 74%)}
#cv{display:block;width:100%;height:100%}
#topbar{
  position:absolute;left:0;right:0;top:0;height:62px;z-index:5;pointer-events:none;
  display:flex;align-items:center;gap:18px;padding:0 18px;
  background:linear-gradient(180deg,rgba(6,9,13,.96),rgba(6,9,13,.55),transparent);
  backdrop-filter:blur(5px);
}
.stat{display:flex;flex-direction:column;gap:2px;min-width:54px;line-height:1}
.stat b{font-size:18px;font-variant-numeric:tabular-nums;letter-spacing:.2px}
.stat span{font-size:10px;color:var(--faint);letter-spacing:1.5px;white-space:nowrap}
.stat.mana b{color:var(--mana)}.stat.combo b{color:var(--gold)}.stat.wall b{color:var(--good)}.stat.stage b{color:var(--violet)}
#phaseTag{margin-left:auto;border:1px solid var(--line);background:rgba(8,12,17,.75);padding:6px 12px;border-radius:5px;color:var(--dim);font-size:11px;letter-spacing:1.5px}
#wallbar{position:absolute;left:18px;top:62px;width:260px;height:6px;border-radius:3px;background:#202a35;z-index:5;overflow:hidden}
#wallfill{height:100%;width:100%;background:linear-gradient(90deg,var(--good),#a4e66a);transition:width .15s}
#objective{
  position:absolute;left:18px;bottom:18px;z-index:5;min-width:240px;max-width:360px;
  background:linear-gradient(180deg,rgba(16,23,32,.93),rgba(8,12,17,.90));
  border:1px solid rgba(73,199,255,.22);border-radius:7px;padding:10px 13px;
  box-shadow:0 12px 34px rgba(0,0,0,.35);font-size:12px;line-height:1.55;
}
#objective .ot{font-size:10px;letter-spacing:1.7px;color:var(--faint);margin-bottom:3px}
#objective .on{color:var(--mana);font-weight:700}.op{color:var(--dim)}
#toast{position:absolute;top:88px;left:50%;transform:translateX(-50%);z-index:9;display:flex;flex-direction:column;gap:7px;align-items:center;pointer-events:none;width:100%}
.tmsg{max-width:78%;background:rgba(9,13,18,.93);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:5px;padding:8px 14px;color:var(--ink);font-size:12.5px;animation:tin .25s ease}
.tmsg.good{border-left-color:var(--good)}.tmsg.bad{border-left-color:var(--bad)}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}

#shop{background:linear-gradient(180deg,#141d29,#0d131b);overflow-y:auto;padding:16px 14px 28px}
#shop::-webkit-scrollbar{width:7px}#shop::-webkit-scrollbar-thumb{background:#2d3a4e;border-radius:4px}
.panelTitle{font-size:13px;letter-spacing:2px;color:var(--ink);font-weight:700;margin:0 0 10px}
.subline{font-size:11px;color:var(--dim);line-height:1.55;margin-bottom:12px}
.sec{font-size:10px;letter-spacing:2px;color:var(--faint);border-bottom:1px solid var(--line);padding-bottom:6px;margin:16px 0 8px}
.upgrade{
  display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;
  background:linear-gradient(180deg,#1b2635,#151e2b);border:1px solid rgba(255,255,255,.035);
  border-radius:7px;margin-bottom:7px;padding:10px 11px;cursor:pointer;transition:.12s;user-select:none;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.035);
}
.upgrade:hover:not(.off){border-color:#3e536e;transform:translateX(2px);background:#202d40}
.upgrade.off{opacity:.42;cursor:not-allowed}.upgrade h3{font-size:13px;margin-bottom:3px}.upgrade p{font-size:10.5px;color:var(--dim);line-height:1.4}.cost{font-size:13px;color:var(--mana);font-variant-numeric:tabular-nums;white-space:nowrap}.off .cost{color:var(--bad)}
.evoList{display:flex;gap:5px;flex-wrap:wrap}.evoTag{font-size:10px;border:1px solid rgba(168,121,255,.35);color:#c7afff;background:rgba(168,121,255,.11);padding:4px 7px;border-radius:999px}
.treeHead{display:flex;justify-content:space-between;align-items:center;margin:16px 0 8px;border-bottom:1px solid var(--line);padding-bottom:6px}.treeHead b{font-size:10px;letter-spacing:2px;color:var(--faint)}.treeHead span{font-size:11px;color:var(--gold);font-variant-numeric:tabular-nums}.routeTip{margin:-1px 0 9px;padding:7px 9px;border:1px solid rgba(243,189,54,.22);border-radius:6px;background:rgba(243,189,54,.07);color:#dec36d;font-size:10.5px;line-height:1.4}.branchRow{position:relative;margin-bottom:12px;padding-left:42px}.branchRow::before{content:"";position:absolute;left:31px;top:16px;bottom:9px;border-left:1px solid rgba(168,121,255,.22)}.branchLabel{position:absolute;left:0;top:0;width:33px;padding-top:4px;color:#aeb8c7;font-size:10px;font-weight:800;line-height:1.1;text-align:center;letter-spacing:1px}.branchNodes{display:flex;flex-direction:column;gap:6px}.techNode{position:relative;padding:8px 9px;border-radius:7px;background:rgba(27,38,53,.72);border:1px solid rgba(255,255,255,.04);cursor:pointer;transition:.12s}.techNode::before{content:"";position:absolute;left:-11px;top:16px;width:10px;border-top:1px solid rgba(168,121,255,.26)}.techNode:hover:not(.locked):not(.got){border-color:var(--violet);transform:translateX(2px)}.techNode h4{font-size:12px;margin-bottom:3px;color:#d8ccff;padding-right:34px}.techNode p{font-size:10px;line-height:1.35;color:var(--dim)}.techNode .meta,.techNode .hint{font-size:9px;color:var(--faint);margin-top:4px}.techNode .hint{color:#b6c1cf}.techNode.ready{border-color:rgba(243,189,54,.65);background:rgba(45,35,16,.76);box-shadow:0 0 0 1px rgba(243,189,54,.08)}.techNode.ready .hint{color:#f3bd36}.techNode.got{border-color:rgba(75,211,123,.5);background:rgba(18,45,34,.68);cursor:default}.techNode.got h4{color:#8df0ad}.techNode.locked{opacity:.45;cursor:not-allowed}.techNode .costDot{position:absolute;right:8px;top:8px;color:var(--gold);font-size:10px}

#buttonPanel{
  background:
    radial-gradient(circle at 50% 26%,rgba(239,75,85,.20),transparent 58%),
    repeating-linear-gradient(128deg,rgba(239,75,85,calc(var(--doom)*.12)) 0 2px,transparent 2px 19px),
    linear-gradient(180deg,#18090c,#090607 72%);
  padding:24px 14px;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;
}
#sign{width:100%;border:1px solid #522126;background:rgba(32,9,12,.72);text-align:center;padding:12px 8px;border-radius:6px;margin-bottom:28px}
#sign b{display:block;color:#e54a52;font-size:24px;letter-spacing:7px;text-indent:7px;text-shadow:0 0 18px rgba(239,75,85,.58)}
#sign span{font-size:9px;color:#8b4d52;letter-spacing:2px}
#bigbtnWrap{position:relative;width:138px;height:138px;display:grid;place-items:center;margin-bottom:18px}
#bigbtnWrap::before{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,rgba(239,75,85,.26),transparent 64%);filter:blur(3px)}
#bigbtn{position:relative;width:98px;height:98px;border:none;border-radius:50%;cursor:pointer;background:radial-gradient(circle at 36% 28%,#ff747b,#d4272e 52%,#7a0e13);box-shadow:0 8px 0 #5c0a0d,0 13px 32px rgba(239,75,85,.48),inset 0 2px 6px rgba(255,255,255,.28);transition:.1s}
#bigbtn::after{content:"";position:absolute;left:20px;top:16px;width:28px;height:17px;border-radius:50%;background:rgba(255,255,255,.25);filter:blur(1px)}
#bigbtn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 10px 0 #5c0a0d,0 18px 42px rgba(239,75,85,.62),inset 0 2px 6px rgba(255,255,255,.28)}
#bigbtn:active:not(:disabled){transform:translateY(6px);box-shadow:0 2px 0 #5c0a0d,0 4px 12px rgba(239,75,85,.42)}
#bigbtn:disabled{filter:grayscale(.65) brightness(.48);cursor:not-allowed;box-shadow:0 5px 0 #350608}
#btnCd{position:absolute;font-size:22px;font-weight:800;color:#fff;text-shadow:0 2px 5px rgba(0,0,0,.6);pointer-events:none}
#overdrive{width:100%;border:1px solid #442024;background:rgba(25,8,10,.72);border-radius:6px;padding:11px 10px;font-size:11px;line-height:1.7;color:#b98b8e;margin-top:4px}
#overdrive .k{color:#7e5558}.v{float:right;color:#ef4b55;font-variant-numeric:tabular-nums}
#debt{margin-top:12px;width:100%;font-size:11px;line-height:1.65;color:#917579}.debtLine{border-bottom:1px dashed rgba(239,75,85,.22);padding:5px 0}.debtLine b{color:#ef4b55}

.modal{position:fixed;inset:0;z-index:50;background:rgba(3,5,8,.88);backdrop-filter:blur(4px);display:none;place-items:center}.modal.on{display:grid}.mbox{width:min(760px,92vw);background:linear-gradient(180deg,#161f2c,#101720);border:1px solid var(--line);border-radius:10px;padding:28px 30px;box-shadow:0 30px 90px rgba(0,0,0,.5);animation:min .22s ease}@keyframes min{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.mtitle{font-size:22px;margin-bottom:7px}.msub{font-size:13px;line-height:1.65;color:var(--dim);margin-bottom:20px}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.choice{background:linear-gradient(180deg,#1b2635,#151d29);border:1px solid var(--line);border-radius:8px;padding:16px 14px;text-align:left;color:var(--ink);cursor:pointer;transition:.14s}.choice:hover{border-color:var(--violet);transform:translateY(-3px);background:#211b32}.choice h4{font-size:15px;color:#c9b6ff;margin-bottom:8px}.choice p{font-size:12px;color:var(--dim);line-height:1.55}.btnrow{display:flex;justify-content:center;gap:10px;margin-top:22px}.mbtn{background:#202b3a;border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:11px 28px;font:inherit;cursor:pointer}.mbtn.pri{background:#9d171d;border-color:#d33;color:#fff}.grade{font-size:70px;text-align:center;font-weight:900}.rows{display:grid;grid-template-columns:1fr auto;gap:8px 18px;font-size:13px;margin:18px 0}.rows .k{color:var(--dim)}.rows .v{text-align:right;font-variant-numeric:tabular-nums}
kbd{font-family:inherit;background:#263244;border:1px solid #3a4a60;border-bottom-width:2px;border-radius:4px;padding:1px 6px;font-size:11px}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="topbar">
      <div class="stat mana"><b id="sMana">0</b><span>魔力</span></div>
      <div class="stat"><b id="sRate">0/s</b><span>收益</span></div>
      <div class="stat combo"><b id="sCombo">x1.0</b><span>连击</span></div>
      <div class="stat"><b id="sKills">0</b><span>击杀</span></div>
      <div class="stat wall"><b id="sWall">420</b><span>围墙</span></div>
      <div class="stat stage"><b id="sStage">S1</b><span>阶段</span></div>
      <div id="phaseTag">怪潮逼近</div>
    </div>
    <div id="wallbar"><div id="wallfill"></div></div>
    <div id="objective"></div>
    <div id="toast"></div>
  </div>

  <div id="shop">
    <div class="panelTitle">围墙升级</div>
    <div class="subline">不再建塔。升级整座岛的围墙、火力和魔力矿，把防线养成清屏机器。</div>
    <div id="upgradeList"></div>
    <div id="techTree"></div>
  </div>

  <div id="buttonPanel">
    <div id="sign"><b>别按它</b><span>OVERDRIVE DEBT</span></div>
    <div id="bigbtnWrap"><button id="bigbtn"></button><div id="btnCd"></div></div>
    <div id="overdrive">
      <div><span class="k">过载</span><span class="v" id="odState">就绪</span></div>
      <div><span class="k">持续</span><span class="v">20s</span></div>
      <div><span class="k">收益</span><span class="v">x4</span></div>
      <div><span class="k">射速</span><span class="v">x2.45</span></div>
      <div><span class="k">怪潮</span><span class="v">x2.4</span></div>
    </div>
    <div id="debt"></div>
  </div>
</div>
<div class="modal" id="modal"><div class="mbox" id="mbox"></div></div>
<script src="game.js"></script>
</body>
</html>
