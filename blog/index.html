<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>博客 | YHSZ Game</title>
  <link rel="stylesheet" href="../assets/site.css">
  <script src="../data/posts.js" defer></script>
  <script src="../assets/site.js" defer></script>
</head>
<body data-page="blog">
  <header class="topbar">
    <nav class="shell nav" aria-label="主导航">
      <a class="brand" href="../index.html" aria-label="返回首页">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>YHSZ Game</span>
      </a>
      <div class="nav-links">
        <a data-nav="home" href="../index.html">游戏</a>
        <a data-nav="blog" href="./">博客</a>
        <a data-nav="about" href="../about/">个人</a>
      </div>
    </nav>
  </header>

  <main class="shell page">
    <section class="hero">
      <div>
        <p class="eyebrow">Dev Blog</p>
        <h1>博客</h1>
        <p class="lead">记录游戏想法、更新日志和开发过程。</p>
      </div>
      <aside class="hero-panel">
        <strong>记录内容</strong>
        <p>这里保留开发日志、玩法笔记和后续路线图，方便回看每次迭代。</p>
      </aside>
    </section>

    <nav class="breadcrumb" id="breadcrumb" aria-label="面包屑">
      <a href="../index.html">首页</a>
      <span class="crumb-sep">/</span>
      <a href="./">博客</a>
    </nav>

    <section class="toolbar" aria-label="博客工具">
      <button id="blogSearchTrigger" class="button ghost" type="button">
        <span class="search-glyph" aria-hidden="true"></span>
        搜索文章
      </button>
      <p id="blogCount" class="result-count"></p>
    </section>

    <section id="startHere" class="start-grid" aria-label="从这里开始"></section>

    <section class="two-col">
      <aside id="postSidebar" class="post-sidebar" aria-label="博客侧边栏">
        <div class="sidebar-block">
          <h2 class="sidebar-title">分类</h2>
          <div id="categoryList" class="category-list"></div>
        </div>
        <div class="sidebar-block">
          <h2 class="sidebar-title">标签</h2>
          <div id="tagCloud" class="tag-cloud"></div>
        </div>
        <div class="sidebar-block">
          <h2 class="sidebar-title">全部文章</h2>
          <div id="postList" class="post-list" aria-label="文章列表"></div>
        </div>
      </aside>
      <article id="postView" class="markdown-card"></article>
    </section>
  </main>

  <footer class="shell footer">
    <span>Development notes.</span>
    <span>Game ideas archive.</span>
  </footer>
</body>
</html>
